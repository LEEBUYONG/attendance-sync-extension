<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>출결 싱크</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 360px;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
      margin: 0;
    }

    h1 {
      font-size: 17px;
      margin: 0 0 6px;
    }

    .desc {
      font-size: 12px;
      line-height: 1.6;
      color: #6b7280;
      margin-bottom: 14px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      text-align: center;
    }

    .btn:disabled {
      background: #9ca3af !important;
      cursor: not-allowed;
    }

    .btn-preview  { background: #4f46e5; }
    .btn-send     { background: #2563eb; }
    .btn-copy     { background: #374151; }

    .notice {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11px;
      margin-top: 10px;
      line-height: 1.6;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-all;
      background: #f3f4f6;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      max-height: 300px;
      overflow: auto;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>출결 싱크 헬퍼</h1>

  <div class="desc">
    백오피스 출결 페이지에서 실행하세요.<br />
    인원 수는 스크롤 끝까지 내려 자동으로 파악합니다.
  </div>

  <button id="previewBtn" class="btn btn-preview">1. 수집 미리보기</button>
  <button id="sendBtn"    class="btn btn-send">2. 수집 후 Web App으로 전송</button>
  <button id="copyBtn"    class="btn btn-copy">3. 수집 결과 JSON 복사</button>

  <div class="notice">
    ※ Web App URL을 아직 넣지 않았다면 전송은 실패합니다.<br />
    먼저 미리보기와 JSON 복사로 수집 정확도를 확인하세요.
  </div>

  <pre id="result">대기 중...</pre>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
